<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" role="img" aria-label="Support — optional. Free to use, MIT licensed. Buy me a coffee on PayPal.">
  <style>
    .card { fill: #fffdf8; stroke: #ddd8cc; stroke-width: 1; }
    .rule { fill: #2448d8; }
    .mark { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 2px; fill: #2448d8; }
    .copy { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-size: 21px; fill: #14140f; }
    .note { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: .3px; fill: #55524a; }
    .btn { fill: #2448d8; }
    .btn-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14.5px; font-weight: 550; fill: #ffffff; }
  </style>

  <rect class="card" x="0.5" y="0.5" width="719" height="199"/>
  <rect class="rule" x="0" y="0" width="720" height="2"/>

  <text class="mark" x="32" y="48">$ TIP — OPTIONAL</text>

  <text class="copy" x="32" y="90">If the factory earns you back an afternoon, you can send</text>
  <text class="copy" x="32" y="118">a coffee the other way.</text>

  <rect class="btn" x="32" y="136" width="212" height="42"/>
  <text class="btn-label" x="138" y="163" text-anchor="middle">Buy me a coffee ↗</text>

  <text class="note" x="260" y="163">PayPal · any amount</text>
</svg>
